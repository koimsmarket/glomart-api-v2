<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.webmanifest"><title>Glomart 자동주문 실행기</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:720px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #dce2eb;border-radius:14px;padding:18px;margin:12px 0}button{padding:12px 16px;margin:5px;border:0;border-radius:8px;background:#1769e0;color:white}pre{white-space:pre-wrap;background:#101828;color:#dce6ff;padding:14px;border-radius:10px}</style></head><body><div class="wrap"><h1>자동주문 실행기</h1><div class="card"><b>PC 실행 구조</b><p>PWA는 작업현황·실행기 상태를 관리하고, 쿠팡 페이지 실제 조작은 동일 공용 엔진을 불러오는 Tampermonkey 실행기가 담당합니다.</p><button id="install">PWA 설치</button><button id="open">쿠팡 열기</button></div><div class="card"><b>상태</b><pre id="out">준비</pre></div></div><script src="app.js"></script></body></html>
