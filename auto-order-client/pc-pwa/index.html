<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='manifest' href='./manifest.webmanifest'><title>Glomart 자동주문 실행기</title><style>body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;color:#172033}.wrap{max-width:880px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #dfe4ec;border-radius:12px;padding:20px;margin-bottom:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}input{width:100%;box-sizing:border-box;padding:11px}button{padding:11px 16px;border:0;border-radius:8px;background:#1463d6;color:#fff;font-weight:700;margin-right:8px}pre{background:#111827;color:#d1fae5;padding:14px;border-radius:8px;min-height:120px}</style></head><body><div class='wrap'><h1>자동주문 실행기</h1><div class='card'><div class='row'><div>담당 관리자 ID<input id='adminId'></div><div>몰 계정 ID<input id='mallAccountId'></div></div><p><label><input id='ready' type='checkbox' style='width:auto'> 이 PC에서 쿠팡 주문 실행 가능</label></p><button id='save'>설정 저장</button><button id='start'>쿠팡 실행</button><button id='stop'>중지</button></div><div class='card'><pre id='status'>대기 중</pre></div><script src='../shared/js/GMAO_CONFIG.js'></script><script src='../shared/js/storage/GMAO_STORE.js'></script><script src='./app.js'></script></div></body></html>
