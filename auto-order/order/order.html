<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>주문관리 - Glomart 외부상품 운영센터</title><link rel="stylesheet" href="../dashboard.css?v=gm_v1"><style>.order-tools{display:grid;grid-template-columns:minmax(240px,1fr) 150px 150px 110px;gap:8px;padding:14px 16px;border-bottom:1px solid #e6e9ee}.order-tools input,.order-tools select{height:38px;border:1px solid #cfd5dd;border-radius:4px;padding:0 10px;background:#fff}.order-tools button{height:38px;border:1px solid #bfc6d0;background:#fff;border-radius:4px;cursor:pointer}.order-summary{padding:10px 16px;color:#606771;font-size:13px;border-bottom:1px solid #e6e9ee}.order-table-wrap{overflow:auto}.order-table{width:100%;border-collapse:collapse;min-width:1180px;font-size:13px}.order-table th,.order-table td{padding:10px 8px;border-bottom:1px solid #e9edf2;text-align:left;vertical-align:top}.order-table th{background:#f7f8fa;color:#4f5660;font-weight:700;white-space:nowrap}.order-table td.num{text-align:right;white-space:nowrap}.order-table .order-no{font-weight:700;color:#1269c7}.status{display:inline-block;padding:2px 7px;border-radius:10px;background:#eef2f6;white-space:nowrap}.status.paid{background:#e8f6ec;color:#25733d}.status.wait{background:#fff4d9;color:#8a6200}.muted{color:#8a929c}.product-cell{max-width:360px;white-space:normal;line-height:1.5}.empty{padding:48px;text-align:center;color:#9299a3}@media(max-width:900px){.order-tools{grid-template-columns:1fr 1fr}.order-tools .wide{grid-column:1/-1}}</style></head><body><header class="topbar"><div class="brand">Glomart</div><div class="top-title">외부상품 운영센터</div></header><div class="layout"><aside class="sidebar"><div class="side-group">주문 운영</div><nav class="side-nav"><a href="../">대시보드</a><a class="active" href="../order/order.html">주문관리</a><a href="../auto/auto_order.html">자동주문</a><a href="../delivery/delivery.html">배송관리</a><a href="../claim/claim.html">취소/교환/반품</a><a href="../cs/cs.html">CS관리</a></nav></aside><main class="main"><section class="page-head"><div><h1>주문관리</h1><p>Glomart 서버의 gm_order / gm_order_item 주문을 직접 조회합니다.</p></div><button id="refreshBtn" type="button">새로고침</button></section><section class="panel"><div class="panel-head"><h2>주문 리스트</h2></div><div class="order-tools"><input id="q" class="wide" type="search" placeholder="주문번호 / 회원ID / 수령인 검색"><select id="orderMode"><option value="">전체 주문</option><option value="external">외부주문</option><option value="internal">내부주문</option><option value="mixed">혼합주문</option></select><select id="paymentStatus"><option value="">전체 결제상태</option><option value="paid">결제완료</option><option value="pending">결제대기</option></select><button id="searchBtn" type="button">조회</button></div><div id="summary" class="order-summary">조회 중...</div><div class="order-table-wrap"><table class="order-table"><thead><tr><th>주문일시</th><th>Glomart 주문번호</th><th>회원</th><th>구분</th><th>판매처</th><th>상품</th><th>결제</th><th>주문상태</th><th>자동주문</th><th>배송</th><th>배송비</th><th>결제금액</th></tr></thead><tbody id="rows"><tr><td colspan="12" class="empty">조회 중...</td></tr></tbody></table></div></section></main></div><script>(function(){'use strict';var VERSION='GM_AUTO_ORDER_ORDER_UI_V001',$=function(id){return document.getElementById(id)};function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}function won(v){var n=Number(v||0);return(Number.isFinite(n)?n:0).toLocaleString('ko-KR')+'원'}function dt(v){if(!v)return'-';var d=new Date(v);if(Number.isNaN(d.getTime()))return esc(v);return d.toLocaleString('ko-KR',{hour12:false})}function statusClass(v){var x=String(v||'').toLowerCase();if(x==='paid'||x.indexOf('complete')>=0)return'status paid';if(x==='pending'||x.indexOf('wait')>=0)return'status wait';return'status'}function autoStatus(r){var s=String(r.item_order_status||'').trim();if(s)return s;if(String(r.order_mode||'').toLowerCase()==='external')return'대기';return'-'}async function load(){$('summary').textContent='조회 중...';$('rows').innerHTML='<tr><td colspan="12" class="empty">조회 중...</td></tr>';var p=new URLSearchParams(),q=$('q').value.trim(),mode=$('orderMode').value,pay=$('paymentStatus').value;if(q)p.set('q',q);if(mode)p.set('order_mode',mode);if(pay)p.set('payment_status',pay);p.set('limit','200');try{var res=await fetch('/api/auto-order/orders?'+p.toString(),{cache:'no-store'}),j=await res.json();if(!res.ok||!j.ok)throw new Error(j.detail||j.error||('HTTP '+res.status));var data=j.data||{},rows=Array.isArray(data.rows)?data.rows:[];$('summary').textContent='총 '+Number(data.total||0).toLocaleString('ko-KR')+'건 / 현재 '+rows.length+'건 표시 · '+VERSION;if(!rows.length){$('rows').innerHTML='<tr><td colspan="12" class="empty">조회된 주문이 없습니다.</td></tr>';return}$('rows').innerHTML=rows.map(function(r){var delivery=Number(r.total_delivery_fee||0)+Number(r.extra_area_delivery_fee||0),member=r.member_id||r.guest_key||'-';return'<tr><td>'+dt(r.ordered_at)+'</td><td class="order-no">'+esc(r.order_no)+'</td><td>'+esc(member)+'</td><td>'+esc(r.order_mode||'-')+'</td><td>'+esc(r.malls||'-')+'</td><td class="product-cell">'+esc(r.product_names||'-')+(Number(r.item_count||0)>1?'<div class="muted">'+esc(r.item_count)+'개 품목</div>':'')+'</td><td><span class="'+statusClass(r.payment_status)+'">'+esc(r.payment_status||'-')+'</span><div class="muted">'+esc(r.payment_method||'')+'</div></td><td><span class="'+statusClass(r.order_status)+'">'+esc(r.order_status||'-')+'</span></td><td><span class="'+statusClass(autoStatus(r))+'">'+esc(autoStatus(r))+'</span></td><td><span class="'+statusClass(r.shipping_status)+'">'+esc(r.shipping_status||'-')+'</span></td><td class="num">'+won(delivery)+'</td><td class="num"><strong>'+won(r.total_payment_price)+'</strong></td></tr>'}).join('')}catch(e){$('summary').textContent='주문 조회 실패';$('rows').innerHTML='<tr><td colspan="12" class="empty">'+esc(e&&e.message||e)+'</td></tr>'}}$('searchBtn').addEventListener('click',load);$('refreshBtn').addEventListener('click',load);$('q').addEventListener('keydown',function(e){if(e.key==='Enter')load()});load()})();</script></body></html>
