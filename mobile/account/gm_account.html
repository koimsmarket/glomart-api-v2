<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="format-detection" content="telephone=no">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=yes">
  <title>내 계정</title>
  <link rel="stylesheet" href="/module/account/GM_ACCOUNT.css?v=gm_v1">
  <script src="/module/server/GM_SERVER.js?v=gm_v1"></script>
  <script src="/module/server/GM_MEMBER.js?v=gm_v1"></script>
  <script src="/module/account/GM_ACCOUNT.js?v=gm_v1" defer></script>
</head>
<body>
  <header class="gm-account-header">
    <button type="button" class="gm-back" data-gm-back aria-label="뒤로가기">‹</button>
    <a class="gm-logo" href="/"><img src="/web/upload/NNEditor/20250228/logo_glomart.png" alt="Glomart" onerror="this.style.display='none';this.parentNode.textContent='Glomart';"></a>
    <a class="gm-cart" href="/order/gm_basket.html" aria-label="장바구니">🛒</a>
  </header>

  <main class="gm-account" data-gm-account-root>
    <h1>내 계정</h1>
    <div class="gm-msg" data-gm-message>회원 정보를 확인하고 있습니다.</div>

    <section class="gm-card gm-profile-card">
      <div>
        <div class="gm-small">안녕하세요</div>
        <strong data-gm-member-name>-</strong>
        <p data-gm-member-id>-</p>
      </div>
      <button type="button" class="gm-line-btn" data-gm-refresh>새로고침</button>
    </section>

    <section class="gm-card">
      <div class="gm-card-head">
        <h2>예치금/포인트</h2>
      </div>
      <div class="gm-balance-grid">
        <div class="gm-balance primary"><span>사용 가능 예치금</span><strong data-gm-usable-balance>0원</strong></div>
        <div class="gm-balance"><span>입금 예치금</span><strong data-gm-deposit-balance>0원</strong></div>
        <div class="gm-balance"><span>보너스</span><strong data-gm-bonus-balance>0원</strong></div>
        <div class="gm-balance"><span>포인트</span><strong data-gm-point-balance>0P</strong></div>
      </div>
    </section>

    <section class="gm-card gm-menu-card">
      <a href="/member/modify.html">회원정보 수정 <span>›</span></a>
      <a href="/myshop/addr/list.html">배송지 관리 <span>›</span></a>
      <a href="/myshop/order/list.html">주문내역 <span>›</span></a>
      <a href="/order/gm_basket.html">장바구니 <span>›</span></a>
    </section>

    <section class="gm-card">
      <div class="gm-card-head">
        <h2>네트워크 현황</h2>
        <span class="gm-note">STEP별 회원수</span>
      </div>
      <div class="gm-step-grid" data-gm-network-steps>
        <div class="gm-empty">조회된 네트워크 자료가 없습니다.</div>
      </div>
    </section>

    <section class="gm-card">
      <div class="gm-card-head">
        <h2>월별 포인트</h2>
        <button type="button" class="gm-line-btn small" data-gm-network-month>월별조회</button>
      </div>
      <div class="gm-table" data-gm-monthly-summary>
        <div class="gm-empty">월별 포인트 내역이 없습니다.</div>
      </div>
    </section>

    <section class="gm-card">
      <div class="gm-card-head">
        <h2>최근 내역</h2>
        <button type="button" class="gm-line-btn small" data-gm-ledger-more>더보기</button>
      </div>
      <div class="gm-ledger-list" data-gm-ledger-list>
        <div class="gm-empty">최근 내역이 없습니다.</div>
      </div>
    </section>
  </main>
</body>
</html>
