<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상세 콘텐츠 수집 전용 로그인</title><style>body{font:16px sans-serif;max-width:430px;margin:9vh auto;padding:20px}input,select,button{box-sizing:border-box;padding:12px;width:100%;margin:9px 0}button{background:#156ce0;color:white;border:0;border-radius:6px}input{border:1px solid #888;border-radius:5px}</style></head><body><h2>상세 콘텐츠 수집 전용</h2><p>승인 계정만 접근할 수 있으며 일반 빌더 관리자 권한은 부여되지 않습니다.</p><form id="f"><label>계정<select id="account"><option>derzon</option><option>derzon1287</option><option>msoon</option></select></label><label>비밀번호<input id="password" type="password" required autocomplete="current-password" maxlength="256"></label><button>로그인</button></form><p id="msg" role="alert"></p><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password'),m=document.getElementById('msg');try{const r=await fetch('/api/gm/detail-collector/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:document.getElementById('account').value,password:p.value})});p.value='';if(!r.ok)throw Error('인증 실패: '+r.status);location.replace('/detail-collector/');}catch(e){p.value='';m.textContent=e.message;}};</script></body></html>
