<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>레코드 직접 조회/수정 · GM Builder V049</title><link rel="stylesheet" href="/builder/GM_BUILDER_COMMON.css?v=gm_builder_v049"></head><body><div class="wrap">
<div class="head"><div><h1>레코드 직접 조회 / 수정</h1><div class="small">허용 테이블만 조회하며 기준키·보호 컬럼은 수정할 수 없습니다.</div></div><div class="nav"><a href="/gm_data_builder.html">Builder 홈</a></div></div>
<div class="warning"><b>직접 수정 안전장치</b><br>조회 후 한 레코드만 선택하여 수정합니다. 기준키와 blocked 컬럼은 잠기며, 저장 전에 변경 컬럼을 확인합니다.</div>
<div class="card"><div class="grid"><div><label>테이블</label><select id="tableSelect" onchange="loadRecordMeta()"></select></div><div><label>조회 개수</label><input id="limitInput" type="number" min="1" max="100" value="50"></div><div><label>조회 컬럼</label><select id="fieldSelect"><option value="">전체</option></select></div><div><label>조회 방식</label><select id="modeSelect"><option value="exact">정확히 일치</option><option value="contains">포함</option></select></div></div><label>조회값</label><input id="valueInput" placeholder="전체 조회는 비워두세요"><button class="green" onclick="searchRecords()">조회</button></div>
<div class="card"><h2>조회 결과</h2><div id="resultInfo" class="small">조회 전</div><div class="record-table-wrap"><table id="resultTable"><tbody><tr><td>조회 전</td></tr></tbody></table></div></div>
<div class="card" id="editorCard" style="display:none"><h2>선택 레코드 수정</h2><div id="keyInfo" class="small"></div><div id="editorFields" class="record-fields"></div><button class="red" onclick="applyRecordUpdate()">변경사항 APPLY</button><button class="gray" onclick="closeEditor()">취소</button></div>
<div class="card"><h2>로그</h2><pre id="log">준비됨</pre></div>
</div><script src="/builder/GM_BUILDER_COMMON.js?v=gm_builder_v049"></script><script src="/builder/GM_BUILDER_RECORD_EDITOR.js?v=gm_builder_v049"></script></body></html>
