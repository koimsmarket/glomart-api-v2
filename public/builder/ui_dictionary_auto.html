<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 사전 자동점검</title><link rel="stylesheet" href="/builder/GM_BUILDER_COMMON.css?v=gm_builder_v082"></head><body><div class="wrap"><div class="head"><div><h1>UI 사전 자동점검</h1><div class="small">정적 소스 스캔 + Runtime 실사용 탐지 혼합형</div></div><a href="/gm_data_builder.html">Builder 돌아가기</a></div><div class="warning"><b>자동 INSERT/DELETE하지 않습니다.</b> 신규·변경·삭제후보는 pending에 모은 뒤 선택 승인합니다. 같은 GM_CODE의 한국어 문구 변경은 GM_CODE를 유지하고 kr만 교체하며 번역상태를 RECHECK로 바꿉니다.</div><div class="card"><h2>자동점검</h2><button class="green" onclick="scanStatic(this)">서버 UI 소스 검사</button> <button class="gray" onclick="loadAll()">새로고침</button><div id="status" class="status">조회 전</div></div><div class="card"><h2>신규 / 변경 / 삭제후보</h2><p><button class="gray" onclick="selectAll(true)">전체 선택</button> <button class="gray" onclick="selectAll(false)">선택 해제</button> <button class="green" onclick="approveSelected(this)">선택 승인</button> <button onclick="ignoreSelected(this)">선택 무시</button></p><div style="overflow:auto;max-height:680px"><table><thead><tr><th>선택</th><th>구분</th><th>GM_CODE</th><th>기존 한국어</th><th>현재 한국어</th><th>페이지</th><th>출처</th><th>횟수</th><th>마지막</th></tr></thead><tbody id="rows"><tr><td colspan="9">조회 전</td></tr></tbody></table></div></div><div class="card"><h2>로그</h2><pre id="log">준비됨</pre></div></div><script src="/builder/GM_BUILDER_UI_DICTIONARY_AUTO.js?v=gm_builder_v001"></script></body></html>
