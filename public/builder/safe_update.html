<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GM Builder - Safe Update</title><link rel="stylesheet" href="/builder/GM_BUILDER_COMMON.css?v=gm_builder_v049"></head><body><div class="wrap"><div class="head"><div><h1>안전 업데이트</h1><div class="small">테이블별 안전정책 전용 화면</div></div><div class="nav"><a href="/gm_data_builder.html">메인</a><a href="/builder/download.html">다운로드</a></div></div>
<div class="warning">기존 테이블별 안전정책을 그대로 유지합니다. 보호 컬럼은 덮어쓰지 않습니다. 대부분은 기존 키 UPDATE이며, gm_category 등 allowInsert가 지정된 테이블은 키가 없으면 INSERT될 수 있습니다.</div><div class="card"><label>대상</label><select id="upTable"></select><label>Excel 또는 CSV 파일</label><input type="file" id="file" accept=".csv,.xlsx,.xls"><button class="gray" onclick="dryRun(this)">검증만 실행</button><button class="red" onclick="applyUpdate(this)">APPLY 입력 후 업데이트</button><button class="green" onclick="applyLeafOnly(this)">카테고리 leaf_yn만 APPLY</button></div><div class="card"><h2>여러 파일</h2><input type="file" id="multiFiles" accept=".csv,.xlsx,.xls" multiple><button class="gray" onclick="dryRunAll(this)">전체 검증</button><button class="red" onclick="applyAll(this)">전체 APPLY</button><p class="small">파일명에 gm_product, gm_category 등 테이블명이 포함되어야 자동 매칭됩니다.</p></div><div class="card"><h2>로그</h2><pre id="log">준비됨</pre></div></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="/builder/GM_BUILDER_COMMON.js?v=gm_builder_v055"></script><script src="/builder/GM_BUILDER_SAFE_UPDATE.js?v=gm_builder_v057"></script></body></html>
