<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카테고리 단위가격</title><link rel="stylesheet" href="/builder/GM_BUILDER_COMMON.css?v=gm_builder_v065"></head><body><div class="wrap"><div class="head"><h1>카테고리 단위가격</h1></div><div class="warning">키워드당 비교 기준단위는 1개입니다. 기준 변경 후 해당 카테고리의 상품+옵션을 함께 재계산합니다.</div><div class="card"><input id="q" placeholder="카테고리/키워드/코드"><button onclick="load()">조회</button><div id="rows"></div></div><div class="card"><h2>전체 재계산</h2><button onclick="allCheck()">전체 검증</button><button class="green" onclick="allApply()">전체 적용</button><pre id="log"></pre></div></div><script>
const log=x=>document.getElementById('log').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);async function load(){let j=await fetch('/api/gm/builder/category-unit/list?q='+encodeURIComponent(q.value)).then(r=>r.json());rows.innerHTML=(j.items||[]).map(x=>`<div style="padding:8px;border-bottom:1px solid #ddd"><b>${x.name_ko||''}</b> ${x.keyword||''}<br><small>${x.gm_code}</small><br><input id="q_${x.gm_code}" value="${x.unit_rule_qty||''}" style="width:70px"><input id="u_${x.gm_code}" value="${x.unit_rule_unit||''}" style="width:70px"><button onclick="save('${x.gm_code}')">저장</button><button onclick="recalc('${x.gm_code}',false)">검증</button><button onclick="recalc('${x.gm_code}',true)">재계산</button></div>`).join('');}
async function save(c){let b={gm_code:c,unit_rule_qty:document.getElementById('q_'+c).value,unit_rule_unit:document.getElementById('u_'+c).value};log(await fetch('/api/gm/builder/category-unit/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json()));}
async function recalc(c,a){log(await fetch('/api/gm/builder/category-unit/recalc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({gm_code:c,apply:a})}).then(r=>r.json()));}
async function allCheck(){log(await fetch('/api/gm/builder/category-unit/recalc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({all:true,apply:false})}).then(r=>r.json()));}
async function allApply(){if(!confirm('전체 상품+옵션 단위가격을 재계산합니다. 계속할까요?'))return;log(await fetch('/api/gm/builder/category-unit/recalc',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({all:true,apply:true})}).then(r=>r.json()));}
load();</script></body></html>
