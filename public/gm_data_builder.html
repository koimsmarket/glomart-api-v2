<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GM Safe Update Builder V003</title>
<style>
body{font-family:Arial,"Noto Sans KR",sans-serif;background:#f5f6f8;margin:0;color:#222}
.wrap{max-width:1060px;margin:24px auto;background:#fff;border-radius:14px;padding:20px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{margin:0 0 6px;font-size:24px}.sub{color:#666;margin-bottom:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{border:1px solid #ddd;border-radius:12px;padding:16px}
label{display:block;font-weight:700;margin:10px 0 6px}
select,input,button{font-size:14px}
select,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}
button{padding:10px 14px;border:0;border-radius:8px;background:#1f6feb;color:white;font-weight:700;cursor:pointer;margin-top:10px;margin-right:8px}
button.red{background:#c0392b}button.gray{background:#666}
.warning{background:#fff3cd;border:1px solid #ffe08a;border-radius:10px;padding:12px;margin:14px 0;line-height:1.55}
pre{background:#111;color:#eee;border-radius:10px;padding:14px;white-space:pre-wrap;max-height:240px;overflow:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>GM Safe Update Builder V003</h1>
<div class="sub">CSV 다운로드 / 안전 업데이트 전용. INSERT·DELETE·REPLACE 없음.</div>

<div class="warning">
<b>안전 정책</b><br>
업로드는 UPDATE ONLY 입니다. 기준키가 DB에 없으면 SKIP 됩니다.<br>
빈칸은 기본값 컬럼 외에는 기존 DB 값을 유지합니다.<br>
부적격 행은 SKIP 되고, 부적격이 많으면 STOP 후 결과 CSV를 다운로드합니다.
</div>

<div class="grid">
  <div class="card">
    <h2>다운로드</h2>
    <label>대상</label>
    <select id="downTable"></select>
    <label>형식</label>
    <select id="format"><option value="csv">CSV</option><option value="json">JSON 미리보기</option></select>
    <button onclick="download()">다운로드</button>
    <button class="gray" onclick="preview()">JSON 미리보기</button>
  </div>
  <div class="card">
    <h2>안전 업데이트</h2>
    <label>대상</label>
    <select id="upTable"></select>
    <label>CSV 파일</label>
    <input type="file" id="file" accept=".csv,text/csv">
    <button class="gray" onclick="dryRun()">검증만 실행</button>
    <button class="red" onclick="applyUpdate()">APPLY 입력 후 업데이트</button>
    <p>업데이트 전 반드시 “검증만 실행” 결과 CSV를 확인하세요.</p>
  </div>
</div>

<div class="card" style="margin-top:16px">
<h2>로그</h2>
<pre id="log">준비됨</pre>
</div>
</div>

<script>
const API = location.origin;
const tables = {
  products:'상품 gm_product',
  cart:'장바구니 gm_basket',
  orders:'주문 gm_order',
  order_items:'주문상품 gm_order_item',
  cs:'CS gm_cs',
  cs_messages:'CS 메시지 gm_cs_message'
};
function fill(){
  for(const id of ['downTable','upTable']){
    document.getElementById(id).innerHTML = Object.entries(tables).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
  }
}
function log(x){ document.getElementById('log').textContent = typeof x === 'string' ? x : JSON.stringify(x,null,2); }
function download(){
  const t=document.getElementById('downTable').value, f=document.getElementById('format').value;
  location.href = `${API}/api/gm/builder/export?table=${encodeURIComponent(t)}&format=${encodeURIComponent(f)}`;
}
async function preview(){
  const t=document.getElementById('downTable').value;
  const r=await fetch(`${API}/api/gm/builder/export?table=${encodeURIComponent(t)}&format=json`);
  log(await r.json());
}
async function send(apply){
  const f=document.getElementById('file').files[0];
  if(!f){ alert('CSV 파일을 선택하세요.'); return; }
  if(apply){
    const x=prompt('실제 업데이트 하려면 APPLY 라고 입력하세요.');
    if(x !== 'APPLY') return;
  }
  const t=document.getElementById('upTable').value;
  const text=await f.text();
  const url=`${API}/api/gm/builder/safe-update?table=${encodeURIComponent(t)}&apply=${apply?'YES':'NO'}`;
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/csv; charset=utf-8'},body:text});
  const blob=await r.blob();
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(apply?'apply':'dryrun')+'_result_'+Date.now()+'.csv';
  a.click();
  log((apply?'업데이트':'검증')+' 결과 CSV 다운로드 완료');
}
function dryRun(){ send(false); }
function applyUpdate(){ send(true); }
fill();
</script>
</body>
</html>
