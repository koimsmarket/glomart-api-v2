<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GM Data Builder</title><style>
body{font-family:Arial,"Noto Sans KR",sans-serif;margin:0;background:#f5f6f8;color:#222}.wrap{max-width:1040px;margin:24px auto;padding:20px;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.08)}h1{font-size:24px;margin:0 0 8px}.sub{color:#666;margin-bottom:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{border:1px solid #ddd;border-radius:12px;padding:16px}label{display:block;font-weight:700;margin:10px 0 6px}select,input,button{font-size:14px}select,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#1f6feb;color:#fff;font-weight:700;cursor:pointer;margin-right:8px;margin-top:10px}button.gray{background:#666}button.red{background:#c0392b}pre{white-space:pre-wrap;background:#111;color:#eee;padding:14px;border-radius:10px;max-height:260px;overflow:auto}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.hint{font-size:12px;color:#666;line-height:1.5}
</style></head><body><div class="wrap"><h1>GM 다운로드 / 업로드 빌더 V001</h1><div class="sub">상품 · 장바구니 · 주문 · 주문상품 · CS 데이터를 CSV/JSON으로 내려받고 CSV로 다시 업로드합니다.</div><div class="grid"><div class="card"><h2>다운로드</h2><label>대상</label><select id="exportTable"></select><div class="row"><div><label>guest_key</label><input id="guestKey" placeholder="test"></div><div><label>member_id</label><input id="memberId"></div><div><label>order_no</label><input id="orderNo"></div></div><label>형식</label><select id="format"><option value="csv">CSV</option><option value="json">JSON 화면보기</option></select><button onclick="download()">다운로드</button><button class="gray" onclick="showJson()">JSON 미리보기</button><p class="hint">CSV는 엑셀에서 바로 열 수 있도록 BOM을 붙여 다운로드합니다.</p></div><div class="card"><h2>업로드</h2><label>대상</label><select id="importTable"></select><label>모드</label><select id="mode"><option value="upsert">upsert: 기존 키 있으면 수정</option><option value="insert">insert: 신규 추가</option></select><label>CSV 파일</label><input type="file" id="file" accept=".csv,text/csv"><button onclick="upload()">업로드</button><button class="red" onclick="clearLog()">로그 지우기</button><p class="hint">헤더명은 DB 컬럼명과 같아야 합니다. 다운로드한 CSV를 수정 후 다시 업로드하는 방식이 가장 안전합니다.</p></div></div><div class="card" style="margin-top:16px"><h2>결과</h2><pre id="log">준비됨</pre></div></div><script>
const API=location.origin;const tableNames={products:'상품 gm_products',cart:'장바구니 gm_basket',orders:'주문 gm_orders',order_items:'주문상품 gm_order_items',cs:'CS gm_cs',cs_messages:'CS 메세지 gm_cs_message'};function log(x){document.getElementById('log').textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}function clearLog(){log('')}function fillTables(){const keys=Object.keys(tableNames);for(const id of ['exportTable','importTable']){document.getElementById(id).innerHTML=keys.map(k=>`<option value="${k}">${tableNames[k]}</option>`).join('')}}function params(format){const p=new URLSearchParams();p.set('table',document.getElementById('exportTable').value);p.set('format',format||document.getElementById('format').value);const g=document.getElementById('guestKey').value.trim();const m=document.getElementById('memberId').value.trim();const o=document.getElementById('orderNo').value.trim();if(g)p.set('guest_key',g);if(m)p.set('member_id',m);if(o)p.set('order_no',o);return p.toString()}function download(){location.href=API+'/api/gm/builder/export?'+params(document.getElementById('format').value)}async function showJson(){const r=await fetch(API+'/api/gm/builder/export?'+params('json'));log(await r.json())}async function upload(){const f=document.getElementById('file').files[0];if(!f){alert('CSV 파일을 선택하세요.');return}const table=document.getElementById('importTable').value;const mode=document.getElementById('mode').value;const text=await f.text();const r=await fetch(API+'/api/gm/builder/import?table='+encodeURIComponent(table)+'&mode='+encodeURIComponent(mode),{method:'POST',headers:{'Content-Type':'text/csv; charset=utf-8'},body:text});log(await r.json())}fillTables();
</script></body></html>
