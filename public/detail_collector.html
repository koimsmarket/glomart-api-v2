<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Glomart 관리자 PC 상세 수집</title><style>body{font:14px sans-serif;max-width:1050px;margin:25px auto;padding:0 15px;color:#1f2937}button,input{padding:8px;margin:5px}button{cursor:pointer}#tree{border:1px solid #ddd;max-height:440px;overflow:auto;padding:8px}#tree label{display:block;padding:5px;border-bottom:1px solid #eee}#tree input{width:16px}#status{white-space:pre-wrap;background:#f6f8fa;padding:14px}small{color:#526072}</style></head><body><h2>상세 콘텐츠 수집 · 관리자 PC</h2><p id="account" role="status">수집 전용 로그인 상태 확인 중…</p><button id="logout">로그아웃</button><h3>수집 카테고리</h3><input id="filter" placeholder="카테고리 검색"><button id="reload">조회</button><div id="tree"></div><p id="picked"></p><h3>작업 상태</h3><pre id="status">조회 중</pre><button id="refresh">상태 새로고침</button><p><strong>PC 수집 실행기 연결 대기:</strong> 카테고리 선택·세 계정 로그인·서버 PID 작업권 API는 제공됩니다. 실제 쿠팡 페이지 DOM 수집은 Chrome 확장 실행기 연결 전에는 시작할 수 없습니다. 서버 Chromium은 사용하지 않습니다.</p><small>다른 빌더 다운로드·DB 수정 권한은 이 화면에서 제공하지 않습니다.</small><script src="/detail-collector/app.js"></script></body></html>
