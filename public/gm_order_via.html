<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Glomart 주문 처리 Via</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--line:#dfe5ef;--text:#1f2937;--muted:#6b7280;--brand:#1769ff;--danger:#dc2626;}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text)}
    .wrap{max-width:1100px;margin:0 auto;padding:16px 12px 36px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.home{font-size:13px;color:#2563eb;text-decoration:none}
    h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.03em}.sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(17,24,39,.04)}
    .row{display:flex;gap:8px}.row input{flex:1;height:42px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:15px}.row button{height:42px;border:0;border-radius:10px;padding:0 14px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}.row button.gray{background:#4b5563}.hint{font-size:12px;color:var(--muted);margin-top:8px}.msg{font-size:13px;margin-top:10px;color:var(--muted)}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.box{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.box b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.box span{font-size:14px;font-weight:800;word-break:break-all}.group{margin-top:12px}.ghead{display:flex;justify-content:space-between;align-items:center;background:#111827;color:#fff;border-radius:12px 12px 0 0;padding:10px 12px;font-weight:800}.ghead small{font-weight:400;color:#d1d5db}.item{display:grid;grid-template-columns:70px 1fr 86px 94px;gap:8px;align-items:center;border:1px solid var(--line);border-top:0;background:#fff;padding:10px 12px}.item:last-child{border-radius:0 0 12px 12px}.thumb{width:56px;height:56px;background:#f3f4f6;border-radius:8px;object-fit:cover}.name{font-size:14px;font-weight:800}.opt,.url{font-size:12px;color:var(--muted);word-break:break-all;margin-top:3px}.qty,.price{text-align:right;font-size:13px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a,.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;text-decoration:none;color:#1f2937;font-size:13px;font-weight:800;cursor:pointer}.actions .primary{background:var(--brand);border-color:var(--brand);color:#fff}.empty{padding:20px;text-align:center;color:var(--muted)}
    @media(max-width:760px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.item{grid-template-columns:56px 1fr;}.qty,.price{text-align:left}.row{flex-direction:column}.row button{width:100%}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>주문 처리 Via</h1><div class="sub">주문번호를 입력하면 주문 상품을 mall_code/source_url 기준으로 묶어서 보여줍니다. 실제 구매 빌더 연결 전 중간 허브입니다.</div></div><a class="home" href="/gm_admin.html">관리자 홈</a></div>
  <div class="panel">
    <div class="row"><input id="orderNo" placeholder="주문번호 입력 예: GM202606300001" autocomplete="off"><button onclick="loadOrder()">주문 조회</button><button class="gray" onclick="clearView()">초기화</button></div>
    <div class="hint">API: /api/order/{order_no}</div><div id="msg" class="msg"></div>
  </div>
  <div id="result"></div>
</div>
<script>
(function(){
  const p=new URLSearchParams(location.search); const no=p.get('order_no')||p.get('orderNo')||''; if(no){ document.getElementById('orderNo').value=no; loadOrder(); }
})();
function t(v){return (v==null?'':String(v)).trim();}
function won(v){const n=Number(String(v||'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n.toLocaleString('ko-KR')+'원':'';}
function detectSource(item){
  const mall=t(item.mall_code||item.mallCode).toUpperCase();
  const url=t(item.product_url||item.source_url||item.url||item.productUrl).toLowerCase();
  if(mall && mall!=='CAFE24' && mall!=='INTERNAL') return mall;
  if(url.includes('coupang.com')||url.includes('link.coupang.com')) return 'CPKR';
  if(url.includes('aliexpress.com')) return 'ALKR';
  if(url.includes('temu.com')) return 'TEMU';
  if(url.includes('shopping.naver.com')||url.includes('smartstore.naver.com')) return 'NPKR';
  return mall||'CAFE24';
}
function imgOf(item){return t(item.image_url||item.product_image||item.thumbnail||item.image||'');}
function urlOf(item){return t(item.product_url||item.source_url||item.url||item.productUrl||'');}
function clearView(){document.getElementById('orderNo').value='';document.getElementById('msg').textContent='';document.getElementById('result').innerHTML='';history.replaceState(null,'','/gm_order_via.html');}
async function loadOrder(){
  const no=t(document.getElementById('orderNo').value); const msg=document.getElementById('msg'); const out=document.getElementById('result');
  if(!no){msg.textContent='주문번호를 입력하세요.';return;}
  history.replaceState(null,'','/gm_order_via.html?order_no='+encodeURIComponent(no));
  msg.textContent='조회 중...'; out.innerHTML='';
  try{
    const r=await fetch('/api/order/'+encodeURIComponent(no),{cache:'no-store'}); const j=await r.json();
    if(!j.ok) throw new Error(j.error||'조회 실패');
    render(j.order,j.items||[]); msg.textContent='조회 완료';
  }catch(e){msg.textContent='조회 실패: '+(e&&e.message?e.message:e);}
}
function render(order,items){
  const out=document.getElementById('result'); if(!order){out.innerHTML='<div class="panel empty">주문을 찾지 못했습니다.</div>';return;}
  const groups={}; items.forEach(it=>{const k=detectSource(it); (groups[k]=groups[k]||[]).push(it);});
  const sumQty=items.reduce((a,it)=>a+Number(it.quantity||it.qty||0),0);
  let html='<div class="panel"><div class="summary">'+
    '<div class="box"><b>주문번호</b><span>'+t(order.order_no)+'</span></div>'+
    '<div class="box"><b>회원/게스트</b><span>'+(t(order.member_id)||t(order.guest_key)||'-')+'</span></div>'+
    '<div class="box"><b>주문상태</b><span>'+t(order.order_status||'-')+'</span></div>'+
    '<div class="box"><b>상품/수량</b><span>'+items.length+' / '+sumQty+'</span></div>'+
    '</div><div class="actions"><button class="primary" onclick="alert(\'다음 단계: 이 주문번호를 기준으로 CPKR/ALKR/CAFE24 구매 빌더를 순차 실행하도록 연결합니다.\')">구매 처리 준비</button><a href="/gm_admin.html">관리자 홈</a><a href="/gm_dashboard.html">대시보드</a></div></div>';
  Object.keys(groups).sort().forEach(k=>{
    const arr=groups[k]; html+='<div class="group"><div class="ghead"><span>'+k+'</span><small>'+arr.length+'개 상품</small></div>';
    arr.forEach(it=>{const im=imgOf(it);const u=urlOf(it); html+='<div class="item">'+
      (im?'<img class="thumb" src="'+im.replace(/"/g,'&quot;')+'" onerror="this.style.display=\'none\'">':'<div class="thumb"></div>')+
      '<div><div class="name">'+t(it.product_name||it.name||'-')+'</div><div class="opt">'+[t(it.option_name),t(it.option_value)].filter(Boolean).join(' / ')+'</div>'+(u?'<div class="url">'+u+'</div>':'')+'</div>'+
      '<div class="qty">수량 '+t(it.quantity||it.qty||1)+'</div><div class="price">'+won(it.customer_order_price||it.mall_sale_price||it.product_amount)+'</div></div>';});
    html+='</div>';
  });
  out.innerHTML=html;
}
</script>
</body>
</html>
