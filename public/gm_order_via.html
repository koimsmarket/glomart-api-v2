<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Glomart 주문 처리 Via V004</title>
  <style>
    :root{--bg:#f5f7fb;--card:#fff;--line:#dfe5ef;--text:#1f2937;--muted:#6b7280;--brand:#1769ff;--danger:#dc2626;--ok:#16a34a;}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--text)}
    .wrap{max-width:1180px;margin:0 auto;padding:16px 12px 36px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.home{font-size:13px;color:#2563eb;text-decoration:none}
    h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.03em}.sub{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.45}.panel{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 12px rgba(17,24,39,.04)}
    .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar input{height:40px;border:1px solid var(--line);border-radius:10px;padding:0 10px;background:#fff}.toolbar button{height:40px;border:0;border-radius:10px;padding:0 14px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer}.toolbar button.gray{background:#4b5563}.toolbar button.light{background:#fff;color:#1f2937;border:1px solid var(--line)}
    .hint,.msg{font-size:12px;color:var(--muted);margin-top:8px}.msg b{color:#111827}.layout{display:grid;grid-template-columns:390px 1fr;gap:12px}.list{display:flex;flex-direction:column;gap:8px}.orderCard{border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;cursor:pointer}.orderCard.active{border-color:var(--brand);box-shadow:0 0 0 2px rgba(23,105,255,.12)}.orderTop{display:flex;justify-content:space-between;gap:8px}.orderNo{font-weight:900;font-size:14px}.badge{display:inline-flex;align-items:center;border-radius:999px;background:#eef2ff;color:#1e40af;font-weight:800;font-size:11px;padding:4px 7px;margin:2px 3px 0 0}.badge.green{background:#dcfce7;color:#166534}.badge.gray{background:#f3f4f6;color:#374151}.meta{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}.amount{font-weight:900;text-align:right}.empty{padding:22px;text-align:center;color:var(--muted)}
    .summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.box{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}.box b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.box span{font-size:14px;font-weight:800;word-break:break-all}.group{margin-top:12px}.ghead{display:flex;justify-content:space-between;align-items:center;background:#111827;color:#fff;border-radius:12px 12px 0 0;padding:10px 12px;font-weight:800}.ghead small{font-weight:400;color:#d1d5db}.item{display:grid;grid-template-columns:70px 1fr 86px 94px;gap:8px;align-items:center;border:1px solid var(--line);border-top:0;background:#fff;padding:10px 12px}.item:last-child{border-radius:0 0 12px 12px}.thumb{width:56px;height:56px;background:#f3f4f6;border-radius:8px;object-fit:cover}.name{font-size:14px;font-weight:800}.opt,.url{font-size:12px;color:var(--muted);word-break:break-all;margin-top:3px}.qty,.price{text-align:right;font-size:13px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions a,.actions button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;text-decoration:none;color:#1f2937;font-size:13px;font-weight:800;cursor:pointer}.actions .primary{background:var(--brand);border-color:var(--brand);color:#fff}.warn{color:#b45309;font-size:12px;margin-top:8px}
    @media(max-width:860px){.layout{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.item{grid-template-columns:56px 1fr;}.qty,.price{text-align:left}.toolbar{align-items:stretch}.toolbar select,.toolbar input,.toolbar button{width:100%}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>주문 처리 Via V004</h1><div class="sub">서버에 저장된 미처리 주문을 Queue 리스트로 불러와 순차 처리합니다. 주문번호 직접 입력은 보조 조회만 사용합니다.</div></div><a class="home" href="/gm_admin.html">관리자 홈</a></div>
  <div class="panel">
    <div class="toolbar">
      <select id="status"><option value="unprocessed">미처리/상품준비중</option><option value="all">전체</option><option value="complete">완료</option><option value="error">오류/보류</option></select>
      <button onclick="loadQueue(true)">주문내역 새로고침</button>
      <button class="light" onclick="selectFirstPending()">첫 주문 선택</button>
      <input id="manualNo" placeholder="보조 조회: 주문번호" autocomplete="off">
      <button class="gray" onclick="loadDetailByManual()">단건 조회</button>
    </div>
    <div class="hint">기본 API: /api/gm/admin/orders?status=unprocessed · 상세: /api/gm/admin/orders/{order_no} · Lock/Builder: V004</div><div id="msg" class="msg"></div>
  </div>
  <div class="layout">
    <div><div class="panel"><b>처리 대기 주문</b><div id="orderList" class="list"><div class="empty">주문내역을 불러오는 중...</div></div></div></div>
    <div id="result"><div class="panel empty">왼쪽에서 처리할 주문을 선택하세요.</div></div>
  </div>
</div>
<script>
let ORDERS=[]; let CURRENT='';
(function(){ loadQueue(true); const p=new URLSearchParams(location.search); const no=p.get('order_no')||p.get('orderNo')||''; if(no){document.getElementById('manualNo').value=no; setTimeout(()=>loadDetail(no),250);} })();
function t(v){return (v==null?'':String(v)).trim();}
function esc(v){return t(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function won(v){const n=Number(String(v||'').replace(/[^0-9.-]/g,''));return Number.isFinite(n)?n.toLocaleString('ko-KR')+'원':'';}
function dateText(v){const s=t(v); if(!s) return '-'; try{return new Date(s).toLocaleString('ko-KR');}catch(e){return s;}}
function detectSource(item){const pre=t(item.source_mall||item.sourceMall||item.source_code||item.sourceCode).toUpperCase(); if(pre) return pre; const su=t(item.source_uid||item.sourceUid).toUpperCase(); if(su.includes('_')) return su.split('_')[0]; const mall=t(item.mall_code||item.mallCode).toUpperCase(); const url=t(item.product_url||item.source_url||item.url||item.productUrl).toLowerCase(); if(mall && mall!=='CAFE24' && mall!=='INTERNAL') return mall; if(url.includes('coupang.com')||url.includes('link.coupang.com')) return 'CPKR'; if(url.includes('aliexpress.com')) return 'ALKR'; if(url.includes('temu.com')) return 'TEMU'; if(url.includes('shopping.naver.com')||url.includes('smartstore.naver.com')) return 'NPKR'; return mall||'CAFE24';}
function imgOf(item){return t(item.image_url||item.product_image||item.thumbnail||item.thumb_url||item.image||'');}
function urlOf(item){return t(item.product_url||item.source_url||item.url||item.productUrl||'');}
async function loadQueue(autoSelect){
  const msg=document.getElementById('msg'), list=document.getElementById('orderList'); const st=document.getElementById('status').value;
  msg.textContent='주문내역 조회 중...'; list.innerHTML='<div class="empty">조회 중...</div>';
  try{ const r=await fetch('/api/gm/admin/orders?status='+encodeURIComponent(st)+'&limit=100',{cache:'no-store'}); const txt=await r.text(); let j; try{j=JSON.parse(txt);}catch(_){throw new Error('API가 JSON이 아니라 HTML/텍스트를 반환했습니다. server.js V004 배포 여부를 확인하세요. 응답 앞부분: '+txt.slice(0,80));} if(!j.ok) throw new Error(j.error||j.message||'조회 실패'); ORDERS=j.items||[]; renderQueue(j); msg.innerHTML='<b>'+ORDERS.length+'</b>건 표시 / 전체 '+(j.total||ORDERS.length)+'건'; if(autoSelect && ORDERS.length) loadDetail(ORDERS[0].order_no); }
  catch(e){ msg.textContent='주문내역 조회 실패: '+(e&&e.message?e.message:e); list.innerHTML='<div class="empty">조회 실패</div>'; }
}
function renderQueue(j){
  const list=document.getElementById('orderList'); const arr=ORDERS; if(!arr.length){list.innerHTML='<div class="empty">표시할 주문이 없습니다.</div>';return;}
  list.innerHTML=arr.map(o=>{const codes=t(o.source_codes||o.mall_codes).split(',').filter(Boolean); return '<div class="orderCard '+(CURRENT===t(o.order_no)?'active':'')+'" onclick="loadDetail(\''+esc(o.order_no)+'\')"><div class="orderTop"><div><div class="orderNo">'+esc(o.order_no)+'</div><div>'+codes.map(c=>'<span class="badge">'+esc(c)+'</span>').join('')+'</div></div><div class="amount">'+won(o.total_payment_price||o.total_item_amount)+'</div></div><div class="meta">상태: '+esc(o.order_status||'-')+' · 상품 '+esc(o.item_count||0)+' / 수량 '+esc(o.total_qty||0)+'<br>주문일: '+esc(dateText(o.ordered_at||o.created_at))+'<br>회원: '+esc(o.member_id||o.guest_key||'-')+'</div></div>'}).join('');
}
function selectFirstPending(){ if(ORDERS.length) loadDetail(ORDERS[0].order_no); }
function loadDetailByManual(){ const no=t(document.getElementById('manualNo').value); if(no) loadDetail(no); }
async function loadDetail(no){
  CURRENT=t(no); history.replaceState(null,'','/gm_order_via.html?order_no='+encodeURIComponent(CURRENT)); renderQueue({items:ORDERS}); const out=document.getElementById('result'); out.innerHTML='<div class="panel empty">주문 상세 조회 중...</div>';
  try{ const r=await fetch('/api/gm/admin/orders/'+encodeURIComponent(CURRENT),{cache:'no-store'}); const txt=await r.text(); let j; try{j=JSON.parse(txt);}catch(_){throw new Error('상세 API가 JSON이 아니라 HTML/텍스트를 반환했습니다. server.js V004 배포 여부를 확인하세요. 응답 앞부분: '+txt.slice(0,80));} if(!j.ok) throw new Error(j.error||j.message||'조회 실패'); renderDetail(j.order,j.items||[]); }
  catch(e){ out.innerHTML='<div class="panel empty">상세 조회 실패: '+esc(e&&e.message?e.message:e)+'</div>'; }
}

async function startOrder(){
  if(!CURRENT){alert('선택된 주문이 없습니다.');return;}
  const out=document.getElementById('msg'); out.textContent='주문 Lock 처리 중...';
  try{
    const r=await fetch('/api/gm/admin/orders/'+encodeURIComponent(CURRENT)+'/lock',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'auto_processing',operator:'admin'})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'lock failed');
    out.innerHTML='주문 <b>'+esc(CURRENT)+'</b> Lock 완료: '+esc(j.updated?'상태 갱신':'상태컬럼 없음/미갱신')+' · '+esc(j.next_status||'auto_processing');
    await loadDetail(CURRENT);
  }catch(e){ out.textContent='주문 Lock 실패: '+(e&&e.message?e.message:e); }
}
async function setOrderStatus(status){
  if(!CURRENT){alert('선택된 주문이 없습니다.');return;}
  try{
    const r=await fetch('/api/gm/admin/orders/'+encodeURIComponent(CURRENT)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'status failed');
    document.getElementById('msg').innerHTML='주문 <b>'+esc(CURRENT)+'</b> 상태 변경: '+esc(status)+' / '+esc(j.updated?'갱신':'미갱신');
    await loadDetail(CURRENT);
  }catch(e){ alert('상태 변경 실패: '+(e&&e.message?e.message:e)); }
}
async function startBuilder(sourceCode, count){
  if(!CURRENT){alert('선택된 주문이 없습니다.');return;}
  const msg=document.getElementById('msg'); msg.textContent=sourceCode+' Builder 시작 준비 중...';
  try{
    const r=await fetch('/api/gm/admin/orders/'+encodeURIComponent(CURRENT)+'/builder/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_code:sourceCode,item_count:count})});
    const j=await r.json(); if(!j.ok) throw new Error(j.error||'builder start failed');
    msg.innerHTML='<b>'+esc(j.builder_code)+'</b> 준비 완료 · '+esc(j.phase)+' · 상품 '+esc(j.item_count)+'개';
  }catch(e){ msg.textContent='Builder 시작 실패: '+(e&&e.message?e.message:e); }
}
function renderDetail(order,items){
  const out=document.getElementById('result'); if(!order){out.innerHTML='<div class="panel empty">주문을 찾지 못했습니다.</div>';return;}
  const groups={}; items.forEach(it=>{const k=detectSource(it); (groups[k]=groups[k]||[]).push(it);});
  const sumQty=items.reduce((a,it)=>a+Number(it.quantity||it.qty||0),0);
  let html='<div class="panel"><div class="summary">'+
    '<div class="box"><b>주문번호</b><span>'+esc(order.order_no)+'</span></div>'+ '<div class="box"><b>회원/게스트</b><span>'+(esc(order.member_id)||esc(order.guest_key)||'-')+'</span></div>'+ '<div class="box"><b>주문상태</b><span>'+esc(order.order_status||'-')+'</span></div>'+ '<div class="box"><b>상품/수량</b><span>'+items.length+' / '+sumQty+'</span></div>'+ '</div><div class="actions"><button class="primary" onclick="startOrder()">선택 주문 Lock</button><button onclick="setOrderStatus('builder_wait')">Builder 대기</button><button onclick="setOrderStatus('payment_wait')">결제대기</button><button onclick="selectNext()">다음 주문</button><a href="/gm_dashboard.html">대시보드</a></div><div class="warn">현재 V004는 주문 Lock/상태변경 API와 source_code별 Builder 시작 API까지 연결합니다. 실제 장바구니 자동담기는 다음 단계에서 builder_code별 모듈에 붙입니다.</div></div>';
  Object.keys(groups).sort().forEach(k=>{ const arr=groups[k]; html+='<div class="group"><div class="ghead"><span>'+esc(k)+'</span><small>'+arr.length+'개 상품 · <button style="margin-left:8px;border:0;border-radius:8px;padding:5px 8px;font-weight:800;cursor:pointer" onclick="startBuilder(\''+esc(k)+'\','+arr.length+')">Builder 시작</button></small></div>'; arr.forEach(it=>{const im=imgOf(it);const u=urlOf(it); html+='<div class="item">'+(im?'<img class="thumb" src="'+esc(im)+'" onerror="this.style.display=\'none\'">':'<div class="thumb"></div>')+'<div><div class="name">'+esc(it.product_name||it.name||'-')+'</div><div class="opt">'+esc([t(it.option_name),t(it.option_value)].filter(Boolean).join(' / '))+'</div>'+(u?'<div class="url">'+esc(u)+'</div>':'')+'</div><div class="qty">수량 '+esc(it.quantity||it.qty||1)+'</div><div class="price">'+won(it.customer_order_price||it.mall_sale_price||it.product_amount)+'</div></div>'; }); html+='</div>'; });
  out.innerHTML=html;
}
function selectNext(){ const idx=ORDERS.findIndex(o=>t(o.order_no)===CURRENT); if(idx>=0 && idx<ORDERS.length-1) loadDetail(ORDERS[idx+1].order_no); else alert('다음 주문이 없습니다.'); }
</script>
</body>
</html>
