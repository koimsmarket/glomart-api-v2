<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GM 운영 대시보드</title>
<style>
  :root{--bg:#f4f6f8;--card:#fff;--line:#d9e2ec;--text:#17212b;--muted:#64748b;--ok:#14883f;--warn:#c77700;--bad:#b42318;--blue:#0969da;}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans KR',sans-serif;font-size:14px}
  .wrap{max-width:1320px;margin:0 auto;padding:18px} h1{margin:0;font-size:24px} .sub{color:var(--muted);margin-top:6px}
  .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.btns{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.green{background:var(--ok);color:#fff}.blue{background:var(--blue);color:#fff}.gray{background:#e5e7eb;color:#111827}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .card h2{font-size:17px;margin:0 0 10px}.metric{font-size:28px;font-weight:800;margin:8px 0}.small{font-size:12px;color:var(--muted)}
  .badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700}.b-ok{background:#e7f8ee;color:var(--ok)}.b-warn{background:#fff3d6;color:var(--warn)}.b-bad{background:#fee4e2;color:var(--bad)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.wide{grid-column:1/-1} table{width:100%;border-collapse:collapse;font-size:13px} th,td{border-bottom:1px solid #edf2f7;padding:8px 7px;text-align:left;vertical-align:top} th{background:#f8fafc;color:#334155;font-weight:800} td.num{text-align:right;font-variant-numeric:tabular-nums}.ellipsis{max-width:420px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid #e5e7eb}.rowflex{display:flex;gap:8px;align-items:center}.log{white-space:pre-wrap;background:#0b1020;color:#b7f7c9;border-radius:10px;padding:10px;max-height:200px;overflow:auto;font-family:Consolas,monospace;font-size:12px}.hidden{display:none}
  #topProducts th,#topProducts td{white-space:nowrap}
  #topProducts td:first-child{white-space:normal}
  #topProducts td:first-child .ellipsis{max-width:360px}
  #topProducts th:last-child,#topProducts td:last-child{min-width:118px;white-space:nowrap}
  #topProducts th:nth-child(2),#topProducts td:nth-child(2){min-width:54px;white-space:nowrap}
  @media(max-width:980px){.grid,.cols{grid-template-columns:1fr}.top{display:block}.btns{margin-top:10px}.ellipsis{max-width:220px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>GM 운영 대시보드</h1><div class="sub" id="stamp">검색/상품/Queue 실시간 상태</div></div>
    <div class="btns"><button class="btn green" onclick="loadDash()">새로고침</button><button class="btn blue" onclick="toggleAuto()" id="autoBtn">자동 새로고침 ON</button><a class="btn gray" href="/gm_data_builder.html">Builder</a></div>
  </div>

  <div class="grid">
    <div class="card"><h2>상품</h2><div class="metric" id="mProduct">-</div><div class="small">오늘 신규 <b id="mNew">-</b> / 오늘 갱신 <b id="mUpd">-</b></div></div>
    <div class="card"><h2>검색</h2><div class="metric" id="mSearch">-</div><div class="small">검색어 집계 <b id="mKeyword">-</b></div></div>
    <div class="card"><h2>Queue</h2><div class="metric" id="mQueue">-</div><div class="small"><span id="qBadge" class="badge">-</span> done <b id="qDone">-</b> / failed <b id="qFailed">-</b></div></div>
    <div class="card"><h2>DB</h2><div class="metric" id="mDb">-</div><div class="small">API 응답 <b id="mApi">-</b> ms</div></div>
  </div>

  <div class="cols">
    <div class="card"><h2>검색어 TOP</h2><table id="topKeywords"></table></div>
    <div class="card"><h2>카테고리 키워드별 상품수</h2><table id="categoryKeyword"></table></div>
    <div class="card wide"><h2>최근 Queue 처리</h2><table id="queueRecent"></table></div>
    <div class="card wide"><h2>최근 등록/갱신 상품</h2><table id="recentProducts"></table></div>
    <div class="card"><h2>상품 TOP</h2><table id="topProducts"></table></div>
    <div class="card"><h2>최근 검색 로그</h2><table id="recentSearches"></table></div>
    <div class="card wide"><h2>원본 응답 로그</h2><div class="log" id="rawLog">-</div></div>
  </div>
</div>
<script>
const API=''; let auto=true, timer=null;
function esc(v){return String(v??'').replace(/[&<>"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));}
function num(v){return v==null?'-':Number(v).toLocaleString('ko-KR');}
function date(v){if(!v)return '-'; try{return new Date(v).toLocaleString('ko-KR',{hour12:false});}catch(e){return v}}
function dateShort(v){if(!v)return '-'; try{const d=new Date(v); const z=n=>String(n).padStart(2,'0'); return `${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}`;}catch(e){return v}}
function set(id,v){document.getElementById(id).textContent=v}
function table(id, heads, rows){document.getElementById(id).innerHTML='<thead><tr>'+heads.map(h=>`<th>${esc(h)}</th>`).join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody>';}
function queueBadge(q){const b=document.getElementById('qBadge'); const failed=Number(q.failed||0), pending=Number(q.pending||0), processing=Number(q.processing||0); b.className='badge '+(failed?'b-bad':(pending||processing?'b-warn':'b-ok')); b.textContent=failed?'오류':(pending||processing?'처리중':'정상');}
async function loadDash(){
  const r=await fetch(`${API}/api/gm/dashboard/ops?limit=30&t=${Date.now()}`); const j=await r.json();
  if(!j.ok){ set('rawLog', JSON.stringify(j,null,2)); return; }
  const c=j.counts||{}, q=(j.queue&&j.queue.summary)||{}, today=j.today||{};
  set('stamp', `조회: ${date(j.generated_at)}`); set('mProduct', num(c.gm_product)); set('mNew', num(today.products_new)); set('mUpd', num(today.products_updated));
  set('mSearch', num(c.gm_search_log)); set('mKeyword', num(c.gm_search_keyword_stat)); set('mQueue', num(q.total)); set('qDone', num(q.done)); set('qFailed', num(q.failed)); queueBadge(q);
  set('mDb', j.db_size&&j.db_size.mb!=null ? `${j.db_size.mb} MB` : '-'); set('mApi', num(j.api_response_ms));
  table('topKeywords',['검색어','국가','언어','몰','횟수','결과합','Queue합','최근'], (j.search.top_keywords||[]).map(x=>`<tr><td>${esc(x.keyword_normalized)}</td><td>${esc(x.country_code)}</td><td>${esc(x.lang_code)}</td><td>${esc(x.mall_code)}</td><td class="num">${num(x.search_count)}</td><td class="num">${num(x.result_count_sum)}</td><td class="num">${num(x.queue_send_count_sum)}</td><td>${date(x.last_search_at)}</td></tr>`));
  table('categoryKeyword',['키워드','상품수','hit','최근'], (j.product.category_keyword||[]).map(x=>`<tr><td>${esc(x.category_keyword)}</td><td class="num">${num(x.product_count)}</td><td class="num">${num(x.hit_count)}</td><td>${date(x.last_updated_at)}</td></tr>`));
  table('queueRecent',['ID','검색어','몰','수량','상태','처리결과','생성','처리'], (j.queue.recent||[]).map(x=>{let rr=x.result_json||{}; if(typeof rr==='string'){try{rr=JSON.parse(rr)}catch(e){}} return `<tr><td class="num">${num(x.queue_id)}</td><td>${esc(x.keyword)}</td><td>${esc(x.mall_code)}</td><td class="num">${num(x.item_count)}</td><td>${esc(x.status)}</td><td>recv ${num(rr.received)} / save ${num(rr.saved)} / ins ${num(rr.inserted)} / upd ${num(rr.updated)} / skip ${num(rr.skipped)}</td><td>${date(x.created_at)}</td><td>${date(x.processed_at)}</td></tr>`;}));
  table('recentProducts',['이미지','상품','키워드','가격','hit','생성','갱신'], (j.product.recent||[]).map(x=>`<tr><td>${x.thumb_origin_url?`<img class="thumb" src="${esc(x.thumb_origin_url)}">`:''}</td><td><div class="ellipsis">${esc(x.product_name)}</div><div class="small">${esc(x.product_uid)}</div></td><td>${esc(x.category_keyword)}</td><td class="num">${num(x.mall_sale_price)}</td><td class="num">${num(x.hit_count)}</td><td>${date(x.created_at)}</td><td>${date(x.updated_at)}</td></tr>`));
  table('topProducts',['상품','키워드','hit','view','search','갱신'], (j.product.top||[]).map(x=>`<tr><td><div class="ellipsis">${esc(x.product_name)}</div></td><td>${esc(x.category_keyword)}</td><td class="num">${num(x.hit_count)}</td><td class="num">${num(x.view_count)}</td><td class="num">${num(x.search_count)}</td><td>${dateShort(x.updated_at)}</td></tr>`));
  table('recentSearches',['검색어','언어','국가','몰','결과','Queue','시간'], (j.search.recent||[]).map(x=>`<tr><td>${esc(x.keyword_original||x.keyword_normalized)}</td><td>${esc(x.keyword_lang_code||x.ui_lang_code)}</td><td>${esc(x.country_code)}</td><td>${esc(x.mall_code)}</td><td class="num">${num(x.result_count)}</td><td class="num">${num(x.queue_send_count)}</td><td>${date(x.search_at||x.created_at)}</td></tr>`));
  document.getElementById('rawLog').textContent=JSON.stringify({today:j.today, counts:j.counts, queue:j.queue.summary},null,2);
}
function toggleAuto(){auto=!auto; document.getElementById('autoBtn').textContent='자동 새로고침 '+(auto?'ON':'OFF'); if(auto){timer=setInterval(loadDash,10000)}else{clearInterval(timer)}}
loadDash(); timer=setInterval(loadDash,10000);
</script>
</body>
</html>
