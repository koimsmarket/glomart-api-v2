<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glomart 캐시 검색/주문 폼</title>
<style>body{font-family:Arial,"Noto Sans KR",sans-serif;margin:0;background:#f7f7f7}header{position:sticky;top:0;background:#fff;padding:12px;border-bottom:1px solid #ddd}form{display:flex;gap:6px}input{flex:1;height:42px;border:1px solid #ccc;border-radius:8px;padding:0 10px}button{border:0;border-radius:8px;background:#111;color:#fff;padding:0 12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:10px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px}.card img{width:100%;height:145px;object-fit:cover;border-radius:8px;background:#eee}.title{font-size:13px;font-weight:800;margin-top:8px}.price{font-size:15px;font-weight:900;color:#d00;margin-top:6px}.meta{font-size:12px;color:#555;margin-top:4px}.actions{display:flex;gap:6px;margin-top:8px}.actions a,.actions button{flex:1;text-align:center;text-decoration:none;font-size:12px;padding:8px 2px;border-radius:7px;background:#333;color:#fff}</style>
</head><body><header><form id="f"><input id="q" value="떡볶이"><button type="submit">검색</button></form><div id="status"></div></header><main id="list" class="grid"></main>
<script>
var API_BASE='https://port-0-glomart-api-v2-mordwrnh222b6c36.sel3.cloudtype.app';
function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function render(data){var list=document.getElementById('list'),items=data.items||[];document.getElementById('status').textContent='검색 결과 '+items.length+' / 전체 '+(data.total||0);list.innerHTML=items.map(function(it){var key=it.key||it.vendorItemId||'';return '<article class="card"><img src="'+esc(it.image)+'" loading="lazy"><div class="title">'+esc(it.title)+'</div><div class="price">'+esc(it.priceText)+'</div><div class="meta">'+esc(it.deliveryText||'')+'</div><div class="actions"><button onclick="orderOne(\''+esc(key)+'\')">주문서</button><a target="_blank" href="'+esc(it.url||'#')+'">원본</a></div></article>';}).join('');}
function search(q){document.getElementById('status').textContent='검색 중...';fetch(API_BASE+'/module/scrap/api/cache/search?q='+encodeURIComponent(q)+'&page=1').then(r=>r.json()).then(render).catch(e=>document.getElementById('status').textContent='오류 '+e.message);}
function orderOne(key){fetch(API_BASE+'/module/scrap/api/order/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key,qty:1,note:'폼 테스트 주문'})}).then(r=>r.json()).then(function(j){alert(j.ok?'주문서 생성: '+j.order.orderId:'실패: '+j.error);});}
document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();search(document.getElementById('q').value);});search(document.getElementById('q').value);
</script></body></html>
