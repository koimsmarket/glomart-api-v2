<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Glomart Message Center</title>
  <style>
    :root{--bg:#f3f6fb;--card:#fff;--line:#d9e1ee;--text:#0f172a;--muted:#64748b;--blue:#2563eb}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Arial,"Noto Sans KR",sans-serif;color:var(--text)}
    .wrap{max-width:1180px;margin:0 auto;padding:34px 18px 40px}
    .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    h1{font-size:28px;margin:0 0 6px;font-weight:800}.sub{font-size:14px;color:var(--muted);margin-bottom:22px}
    a.btn{display:inline-flex;border:1px solid var(--line);background:#fff;border-radius:18px;padding:8px 14px;text-decoration:none;color:#334155;font-size:13px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    .tab{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 13px;font-size:13px;cursor:pointer}
    .tab.active{background:#1e293b;color:#fff}
    .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
    .row{display:grid;grid-template-columns:150px 1fr 120px 160px;gap:10px;border-bottom:1px solid #eef2f7;padding:12px 0;font-size:13px}
    .row.head{font-weight:800;color:#334155}
    .muted{color:#64748b}.empty{padding:30px;text-align:center;color:#64748b}
    .note{margin-top:12px;font-size:12px;color:#64748b}
    @media(max-width:850px){.row{grid-template-columns:1fr}.top{display:block}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Message Center</h1>
        <div class="sub">개인메시지, 단체메시지, SmartFit 공유, 공간 구독, 메시지 정책을 조회합니다.</div>
      </div>
      <a class="btn" href="/gm_admin.html">관리자 홈</a>
    </div>
    <div class="tabs">
      <button class="tab active" data-type="personal">개인메시지</button>
      <button class="tab" data-type="broadcast">단체메시지</button>
      <button class="tab" data-type="share">SmartFit 공유</button>
      <button class="tab" data-type="subscriber">공간 구독</button>
      <button class="tab" data-type="policy">메시지 정책</button>
    </div>
    <div class="panel">
      <div id="title" style="font-weight:800;margin-bottom:12px">개인메시지</div>
      <div class="row head"><div>번호/구분</div><div>제목/내용</div><div>상태</div><div>생성일</div></div>
      <div id="list" class="empty">조회 API 연결 전입니다. 메뉴 연결을 먼저 확인하세요.</div>
      <div class="note">V001은 조회관리 화면만 추가합니다. 단체메시지 생성/발송은 Message Center에서만 확장합니다.</div>
    </div>
  </div>
  <script>
    const labels={personal:'개인메시지',broadcast:'단체메시지',share:'SmartFit 공유',subscriber:'공간 구독',policy:'메시지 정책'};
    document.querySelectorAll('.tab').forEach(btn=>{
      btn.addEventListener('click',()=>{
        document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('title').textContent=labels[btn.dataset.type]||btn.dataset.type;
        document.getElementById('list').textContent='조회 API 연결 전입니다. 메뉴 연결을 먼저 확인하세요.';
      });
    });
  </script>
</body>
</html>
