<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Glomart product_data.json 변환기 V1.0</title>
  <style>
    body{font-family:Arial,'Malgun Gothic',sans-serif;margin:20px;background:#f7f7f7;color:#222}
    .box{background:#fff;border:1px solid #ddd;border-radius:10px;padding:16px;margin-bottom:14px}
    h1{font-size:22px;margin:0 0 12px}
    h2{font-size:16px;margin:0 0 10px}
    input,button,textarea{font-size:14px}
    button{padding:9px 14px;border:0;border-radius:8px;background:#222;color:#fff;cursor:pointer;margin-right:8px}
    button.secondary{background:#666}
    button:disabled{background:#aaa;cursor:not-allowed}
    textarea{width:100%;height:220px;font-family:Consolas,monospace;box-sizing:border-box}
    .log{white-space:pre-wrap;background:#111;color:#eee;padding:12px;border-radius:8px;min-height:120px;font-family:Consolas,monospace;font-size:13px}
    .hint{color:#666;font-size:13px;line-height:1.55}
    .ok{color:#0a7b28;font-weight:bold}.bad{color:#b00020;font-weight:bold}
  </style>
</head>
<body>
  <div class="box">
    <h1>Glomart product_data.json 변환기 V1.0</h1>
    <div class="hint">
      쿠팡 수집 CSV를 넣으면 서버용 <b>product_data.json</b> 구조로 변환한다.<br>
      기준키는 <b>productId_itemId_vendorItemId</b> 이다. 헤더명이 조금 달라도 자동 인식한다.
    </div>
  </div>

  <div class="box">
    <h2>1. CSV 파일 선택</h2>
    <input id="file" type="file" accept=".csv,.txt" />
    <button id="buildBtn">변환 실행</button>
    <button id="sampleBtn" class="secondary">샘플 실행</button>
  </div>

  <div class="box">
    <h2>2. 결과 다운로드</h2>
    <button id="downloadBtn" disabled>product_data.json 다운로드</button>
    <button id="copyBtn" disabled class="secondary">결과 복사</button>
  </div>

  <div class="box">
    <h2>로그</h2>
    <div id="log" class="log">대기 중...</div>
  </div>

  <div class="box">
    <h2>결과 미리보기</h2>
    <textarea id="out" readonly></textarea>
  </div>

<script>
(function(){
  'use strict';

  const $ = id => document.getElementById(id);
  let lastJson = null;

  const HEADER_ALIASES = {
    productId: ['productId','ProductId','ProductID','상품ID','상품번호','상품번호(productId)','ProductNo','ProductNo.','productNo','상품코드'],
    itemId: ['itemId','ItemId','ItemID','아이템ID','item_id','쿠팡itemId'],
    vendorItemId: ['vendorItemId','VendorItemId','VendorItemID','VenderitemId','VenderItemId','vendor_item_id','판매자상품ID','벤더아이템ID'],
    title: ['title','상품명','상품명원문','쿠팡상품명','productName','ProductName','내상품명','name'],
    price: ['price','현재가격','판매가','쿠팡판매가','가격','salePrice','finalPrice'],
    soldOut: ['soldOut','품절','품절여부','재고상태','판매상태','stockStatus'],
    mainImage: ['mainImage','대표이미지','메인이미지','thumbnail','썸네일','image','imageUrl','대표이미지URL'],
    productImages: ['productImages','추가이미지','추가이미지URL','상품이미지','이미지목록','images','extraImages'],
    detailImages: ['detailImages','상세이미지','상세페이지이미지','상세이미지URL','상세페이지','detailImageUrls','detailImagesUrl'],
    options: ['options','옵션','옵션명','옵션값','옵션정보','option','optionName','optionValue']
  };

  function log(msg){ $('log').textContent = msg; }
  function normalizeHeader(s){ return String(s||'').trim().replace(/^\uFEFF/,'').replace(/\s+/g,'').toLowerCase(); }
  function findIndex(headers, key){
    const aliases = HEADER_ALIASES[key].map(normalizeHeader);
    const normalized = headers.map(normalizeHeader);
    for(const a of aliases){
      const idx = normalized.indexOf(a);
      if(idx >= 0) return idx;
    }
    return -1;
  }

  function parseCsv(text){
    const rows = [];
    let row = [], cur = '', inQ = false;
    for(let i=0;i<text.length;i++){
      const ch = text[i], next = text[i+1];
      if(ch === '"'){
        if(inQ && next === '"'){ cur += '"'; i++; }
        else inQ = !inQ;
      } else if(ch === ',' && !inQ){
        row.push(cur); cur = '';
      } else if((ch === '\n' || ch === '\r') && !inQ){
        if(ch === '\r' && next === '\n') i++;
        row.push(cur); cur = '';
        if(row.some(v => String(v).trim() !== '')) rows.push(row);
        row = [];
      } else cur += ch;
    }
    row.push(cur);
    if(row.some(v => String(v).trim() !== '')) rows.push(row);
    return rows;
  }

  function cleanText(v){ return String(v == null ? '' : v).trim(); }
  function onlyNumber(v){
    const n = cleanText(v).replace(/[^0-9]/g,'');
    return n ? Number(n) : null;
  }
  function toBoolSoldOut(v){
    const s = cleanText(v).toLowerCase();
    if(!s) return null;
    if(/품절|sold\s*out|out\s*of\s*stock|판매중지|재고없음|not\s*available/.test(s)) return true;
    if(/판매중|재고있음|available|in\s*stock|n|false|0/.test(s)) return false;
    return null;
  }
  function splitList(v){
    const s = cleanText(v);
    if(!s) return [];
    return s.split(/\s*[|;\n]\s*|\s*,\s*(?=https?:\/\/)/g)
      .map(x=>x.trim())
      .filter(Boolean)
      .filter((x,i,a)=>a.indexOf(x)===i);
  }
  function splitOptions(v){
    const s = cleanText(v);
    if(!s) return [];
    // JSON 옵션이면 먼저 파싱
    try {
      const parsed = JSON.parse(s);
      if(Array.isArray(parsed)) return parsed;
    } catch(e) {}
    return s.split(/\s*[|;\n]\s*/).map(x=>x.trim()).filter(Boolean).map(name=>({name}));
  }

  function buildProductData(csvText){
    const rows = parseCsv(csvText);
    if(rows.length < 2) throw new Error('CSV 데이터가 비어있거나 헤더가 없습니다.');
    const headers = rows[0].map(h=>String(h||'').trim());
    const idx = {};
    Object.keys(HEADER_ALIASES).forEach(k => idx[k] = findIndex(headers, k));

    const required = ['productId','itemId','vendorItemId'];
    const missing = required.filter(k => idx[k] < 0);
    if(missing.length){
      throw new Error('필수 헤더를 찾지 못했습니다: ' + missing.join(', ') + '\n현재 헤더: ' + headers.join(' | '));
    }

    const data = {};
    let skipped = 0;
    for(let r=1;r<rows.length;r++){
      const row = rows[r];
      const productId = cleanText(row[idx.productId]);
      const itemId = cleanText(row[idx.itemId]);
      const vendorItemId = cleanText(row[idx.vendorItemId]);
      if(!productId || !itemId || !vendorItemId){ skipped++; continue; }
      const key = `${productId}_${itemId}_${vendorItemId}`;

      const product = data[key] || {
        title: '',
        price: null,
        soldOut: null,
        options: [],
        productImages: [],
        detailImages: [],
        mainImage: null,
        updatedAt: new Date().toISOString()
      };

      if(idx.title >= 0 && !product.title) product.title = cleanText(row[idx.title]);
      if(idx.price >= 0 && product.price == null) product.price = onlyNumber(row[idx.price]);
      if(idx.soldOut >= 0 && product.soldOut == null) product.soldOut = toBoolSoldOut(row[idx.soldOut]);
      if(idx.mainImage >= 0 && !product.mainImage) product.mainImage = cleanText(row[idx.mainImage]) || null;
      if(idx.productImages >= 0) product.productImages = [...new Set(product.productImages.concat(splitList(row[idx.productImages])))];
      if(idx.detailImages >= 0) product.detailImages = [...new Set(product.detailImages.concat(splitList(row[idx.detailImages])))];
      if(idx.options >= 0) product.options = product.options.concat(splitOptions(row[idx.options]));

      data[key] = product;
    }

    for(const k of Object.keys(data)){
      const p = data[k];
      // mainImage가 있으면 productImages 맨 앞에 포함
      if(p.mainImage && !p.productImages.includes(p.mainImage)) p.productImages.unshift(p.mainImage);
      p.options = dedupeOptions(p.options);
      if(p.soldOut == null) p.soldOut = false;
    }

    return { data, count: Object.keys(data).length, skipped, headers, idx };
  }

  function dedupeOptions(options){
    const seen = new Set();
    const out = [];
    for(const o of options || []){
      const name = typeof o === 'string' ? o : (o.name || o.optionName || JSON.stringify(o));
      const key = String(name).trim();
      if(!key || seen.has(key)) continue;
      seen.add(key);
      out.push(typeof o === 'string' ? {name:key} : o);
    }
    return out;
  }

  async function readFile(file){
    const buf = await file.arrayBuffer();
    // UTF-8 우선, 깨짐이 많으면 EUC-KR 대체
    let text = new TextDecoder('utf-8').decode(buf);
    if((text.match(/�/g)||[]).length > 5){
      try { text = new TextDecoder('euc-kr').decode(buf); } catch(e) {}
    }
    return text;
  }

  function finish(result){
    lastJson = JSON.stringify(result.data, null, 2);
    $('out').value = lastJson.slice(0, 20000);
    $('downloadBtn').disabled = false;
    $('copyBtn').disabled = false;
    log([
      '변환 완료',
      '상품키 수: ' + result.count,
      '스킵 행 수: ' + result.skipped,
      '',
      '인식 헤더 위치:',
      JSON.stringify(result.idx, null, 2)
    ].join('\n'));
  }

  $('buildBtn').addEventListener('click', async () => {
    try{
      const file = $('file').files[0];
      if(!file) return alert('CSV 파일을 먼저 선택하세요.');
      log('파일 읽는 중...');
      const text = await readFile(file);
      const result = buildProductData(text);
      finish(result);
    }catch(e){
      log('오류:\n' + e.message);
      console.error(e);
    }
  });

  $('sampleBtn').addEventListener('click', () => {
    const sample = 'productId,itemId,vendorItemId,상품명,쿠팡판매가,품절여부,대표이미지,추가이미지,상세이미지,옵션\n' +
      '9129480378,26861376935,90586753276,샘플상품,12300,판매중,https://thumbnail.coupangcdn.com/sample_main.jpg,https://thumbnail.coupangcdn.com/sample_1.jpg|https://thumbnail.coupangcdn.com/sample_2.jpg,https://image.coupangcdn.com/sample_detail.jpg,옵션A|옵션B';
    finish(buildProductData(sample));
  });

  $('downloadBtn').addEventListener('click', () => {
    if(!lastJson) return;
    const blob = new Blob([lastJson], {type:'application/json;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'product_data.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(a.href);
  });

  $('copyBtn').addEventListener('click', async () => {
    if(!lastJson) return;
    await navigator.clipboard.writeText(lastJson);
    alert('복사 완료');
  });
})();
</script>
</body>
</html>
